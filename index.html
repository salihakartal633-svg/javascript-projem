<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Veresiye & Cari Takip Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a252f;
        }

        /* Özet Kartları */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 5px solid var(--primary);
        }

        .card.borc { border-left-color: var(--danger); }
        .card.alacak { border-left-color: var(--success); }
        .card.bakiye { border-left-color: var(--primary); }

        .card-details h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .card-details .amount {
            font-size: 24px;
            font-weight: 700;
        }

        .card-icon {
            font-size: 30px;
            opacity: 0.3;
        }

        /* Form ve Tablo Alanı */
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media(min-width: 992px) {
            .main-content {
                grid-template-columns: 350px 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-color);
        }

        /* Form Elemanları */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        btn:hover {
            background: #2980b9;
        }

        /* Tablo Tasarımı */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .text-danger { color: var(--danger); font-weight: 600; }
        .text-success { color: var(--success); font-weight: 600; }
        .text-bold { font-weight: 600; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-borc { background: #fde8e8; color: var(--danger); }
        .badge-alacak { background: #def7ec; color: var(--success); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }
        .delete-btn:hover { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-calculator"></i> Veresiye & Cari Hesap Takip</h1>
    </header>

    <div class="summary-cards">
        <div class="card borc">
            <div class="card-details">
                <h3>Toplam Alınan Malzeme (Borç)</h3>
                <div class="amount text-danger" id="totalBorc">0,00 ₺</div>
            </div>
            <div class="card-icon text-danger"><i class="fa-solid fa-truck-ramp-box"></i></div>
        </div>
        <div class="card alacak">
            <div class="card-details">
                <h3>Toplam Yapılan Ödeme (Alacak)</h3>
                <div class="amount text-success" id="totalAlacak">0,00 ₺</div>
            </div>
            <div class="card-icon text-success"><i class="fa-solid fa-wallet"></i></div>
        </div>
        <div class="card bakiye">
            <div class="card-details">
                <h3>Güncel Durum (Kalan Bakiye)</h3>
                <div class="amount" id="totalBakiye">0,00 ₺</div>
            </div>
            <div class="card-icon"><i class="fa-solid fa-scale-balanced"></i></div>
        </div>
    </div>

    <div class="main-content">
        <div class="panel">
            <h2><i class="fa-solid fa-plus-circle"></i> Yeni İşlem Kaydı</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label>İşlem Tarihi</label>
                    <input type="date" id="islemTarihi" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>İşlem Tipi</label>
                    <select id="islemTipi" class="form-control" required>
                        <option value="Borç Kaydı">Malzeme Alımı (Borç Kaydı)</option>
                        <option value="Gelen Havaleler">Ödeme Yapma (Gelen Havale/Alacak)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Açıklama / Malzeme Detayı</label>
                    <input type="text" id="aciklama" class="form-control" placeholder="Örn: 18 MM BETOPAN 1360 X2 ADET" required>
                </div>
                <div class="form-group">
                    <label>Vade Tarihi (Opsiyonel)</label>
                    <input type="date" id="vadeTarihi" class="form-control">
                </div>
                <div class="form-group">
                    <label>Tutar (₺)</label>
                    <input type="number" step="0.01" id="tutar" class="form-control" placeholder="0.00" required>
                </div>
                <button type="submit" class="btn">Sisteme Kaydet</button>
            </form>
        </div>

        <div class="panel">
            <h2><i class="fa-solid fa-list-check"></i> Hesap Hareketleri Listesi</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>İşlem Tarihi</th>
                            <th>İşlem Tipi</th>
                            <th>Açıklama</th>
                            <th>Vade Tarihi</th>
                            <th>Borç (Malzeme)</th>
                            <th>Alacak (Ödeme)</th>
                            <th>Bakiye</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Tarayıcı hafızasında (LocalStorage) verileri saklama
    let transactions = JSON.parse(localStorage.getItem('veresiye_data')) || [];

    // Bugünün tarihini form alanlarına otomatik ata
    document.getElementById('islemTarihi').valueAsDate = new Date();

    // Formu Gönderme Olayı
    document.getElementById('transactionForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const islemTarihi = formatDate(document.getElementById('islemTarihi').value);
        const islemTipi = document.getElementById('islemTipi').value;
        const aciklama = document.getElementById('aciklama').value;
        const vadeRaw = document.getElementById('vadeTarihi').value;
        const vadeTarihi = vadeRaw ? formatDate(vadeRaw) : '-';
        const tutar = parseFloat(document.getElementById('tutar').value);

        let borc = 0;
        let alacak = 0;

        if (islemTipi === "Borç Kaydı") {
            borc = tutar;
        } else {
            alacak = tutar;
        }

        const newTransaction = {
            id: Date.now(),
            islemTarihi,
            islemTipi,
            aciklama,
            vadeTarihi,
            borc,
            alacak
        };

        transactions.push(newTransaction);
        saveAndRender();
        
        // Formu temizle ve tarihi yenile
        document.getElementById('aciklama').value = '';
        document.getElementById('vadeTarihi').value = '';
        document.getElementById('tutar').value = '';
        document.getElementById('islemTarihi').valueAsDate = new Date();
    });

    // Kayıt Silme Fonksiyonu
    function deleteTransaction(id) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndRender();
    }

    // Verileri Kaydet ve Listele
    function saveAndRender() {
        localStorage.setItem('veresiye_data', JSON.stringify(transactions));
        renderTable();
    }

    // Tarih formatını GG.AA.YYYY yapma fonksiyonu
    function formatDate(dateString) {
        if (!dateString) return '-';
        const [year, month, day] = dateString.split('-');
        return `${day}.${month}.${year}`;
    }

    // Para birimini TL formatına çevirme (Örn: 1.250,00 ₺)
    function formatMoney(amount) {
        return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(amount);
    }

    // Tabloyu ve Özetleri Ekrana Basma
    function renderTable() {
        const tbody = document.getElementById('transactionTableBody');
        tbody.innerHTML = '';

        let runningBakiye = 0;
        let totalBorc = 0;
        let totalAlacak = 0;

        transactions.forEach(t => {
            totalBorc += t.borc;
            totalAlacak += t.alacak;
            
            // Bakiye Mantığı: Alınan malzeme (Borç) bakiyeyi artırır, yapılan ödeme (Alacak) bakiyeyi azaltır.
            runningBakiye += (t.borc - t.alacak);

            const badgeClass = t.islemTipi === "Borç Kaydı" ? "badge-borc" : "badge-alacak";

            const row = `
                <tr>
                    <td>${t.islemTarihi}</td>
                    <td><span class="badge ${badgeClass}">${t.islemTipi}</span></td>
                    <td>${t.aciklama}</td>
                    <td>${t.vadeTarihi}</td>
                    <td class="text-danger">${t.borc > 0 ? formatMoney(t.borc) : '0,00 ₺'}</td>
                    <td class="text-success">${t.alacak > 0 ? formatMoney(t.alacak) : '0,00 ₺'}</td>
                    <td class="text-bold">${formatMoney(runningBakiye)}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteTransaction(${t.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        // Üst kart istatistiklerini güncelle
        document.getElementById('totalBorc').innerText = formatMoney(totalBorc);
        document.getElementById('totalAlacak').innerText = formatMoney(totalAlacak);
        
        const bakiyeElement = document.getElementById('totalBakiye');
        bakiyeElement.innerText = formatMoney(runningBakiye);
        
        // Bakiye durumuna göre rengini ayarla
        if (runningBakiye > 0) {
            bakiyeElement.className = "amount text-danger"; // İçeride borç var
        } else if (runningBakiye < 0) {
            bakiyeElement.className = "amount text-success"; // Fazla ödeme / Alacaklı durum
        } else {
            bakiyeElement.className = "amount"; // Hesap sıfırlandı
        }
    }

    // Sayfa ilk yüklendiğinde mevcut verileri getir
    renderTable();
</script>

</body>
</html>
